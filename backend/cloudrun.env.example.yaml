# Variáveis do serviço no Google Cloud Run (D044). Copie para
# backend/cloudrun.env.yaml, preencha e use com `--env-vars-file`.
# O arquivo preenchido é ignorado pelo Git: nunca versione segredos.
# Os valores ficam entre aspas para o YAML não interpretar caracteres especiais.

ZELO_ENV: "production"

# Neon: string de conexão DIRETA (host sem "-pooler"), com o prefixo
# postgresql+psycopg:// e ?sslmode=require no final.
ZELO_DATABASE_URL: "postgresql+psycopg://USUARIO:SENHA@HOST.neon.tech/BANCO?sslmode=require"

# 32+ caracteres. Gere com:
#   py -3.13 -c "import secrets; print(secrets.token_urlsafe(48))"
ZELO_JWT_SECRET: ""

# Chave EcoMed: somente aqui e no backend/.env, nunca no app.
ECOMED_API_KEY: ""

# Opcional: origens do app Web (o APK não usa CORS).
# ZELO_CORS_ORIGINS: "https://seu-app-web.exemplo"

# Opcional: e-mail de recuperação de senha (D043). Exige também
# --no-cpu-throttling no deploy, porque o envio ocorre depois da resposta.
# ZELO_SMTP_HOST: "smtp.gmail.com"
# ZELO_SMTP_USER: ""
# ZELO_SMTP_PASSWORD: ""
